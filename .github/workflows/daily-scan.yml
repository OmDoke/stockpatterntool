name: Daily Candlestick Pattern Scan

on:
  schedule:
    # Runs at 11:00 UTC = 4:30 PM IST, shortly after NSE market close (3:30 PM IST)
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # required for git push to commit reports back
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"    # caches pip packages to speed up subsequent runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pattern scan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scan_watchlist.py

      - name: Commit report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet --cached || git commit -m "Daily pattern scan $(date +'%Y-%m-%d')"
          git push || echo "⚠️ Push failed (likely a concurrent update). Will retry next run."
